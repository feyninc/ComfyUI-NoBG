name: Publish to Comfy registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
  example-workflow:
    uses: ./.github/workflows/test-workflow.yml
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    needs: [unit-tests, example-workflow]
    if: ${{ github.repository_owner == 'feyninc' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publishing tools
        run: pip install comfy-cli
      - name: Publish Custom Node
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          test -n "$REGISTRY_ACCESS_TOKEN" || { echo "REGISTRY_ACCESS_TOKEN is missing"; exit 1; }
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
